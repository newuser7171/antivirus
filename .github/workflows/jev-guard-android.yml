name: Build Jev Guard Android

on:
  push:
    branches: [ main ]
    tags: [ 'jev-guard-v*' ]
    paths:
      - 'android/jev-guard/**'
      - '.github/workflows/jev-guard-android.yml'
  pull_request:
    paths:
      - 'android/jev-guard/**'
      - '.github/workflows/jev-guard-android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/jev-guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Jev-Guard-v0.1.0.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-guard-debug-apk
          path: android/jev-guard/app/build/outputs/apk/debug/Jev-Guard-v0.1.0.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/jev-guard-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Jev Guard v0.1.0
          body: |
            First experimental Android release of Jev Guard.

            Features:
            - APK file picker and local SHA-256 hashing
            - APK package/version inspection
            - Requested-permission analysis
            - Suspicious-permission heuristic risk scoring
            - Signing certificate SHA-256 fingerprints

            Jev Guard is experimental. A low heuristic score does not guarantee that an APK is safe.
          files: android/jev-guard/app/build/outputs/apk/debug/Jev-Guard-v0.1.0.apk
