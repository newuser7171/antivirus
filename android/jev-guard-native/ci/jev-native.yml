name: Jev Guard native detector
on:
  push:
    paths: ['android/jev-guard-native/app/**', 'android/jev-guard-native/tests/**', 'android/jev-guard-native/ci/**', 'android/jev-guard-native/*.gradle', '.github/workflows/jev-native.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/jev-guard-native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Core regression tests
        run: bash tests/run-core-tests.sh
      - name: Compile app and device tests
        run: gradle --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android device checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          script: bash android/jev-guard-native/ci/device-check.sh
      - name: Prepare private local signing tool
        run: |
          mkdir -p build/signing-tools
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" build/signing-tools/
      - uses: actions/upload-artifact@v4
        with:
          name: Jev-Guard-0.2.0-build
          path: |
            android/jev-guard-native/app/build/outputs/apk/release/*unsigned.apk
            android/jev-guard-native/build/signing-tools/apksigner.jar
            android/jev-guard-native/build/device-result.txt
          if-no-files-found: error
